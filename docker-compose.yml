services:
  api:
    build: .
    container_name: viktolearn-api
    
    env_file:
      - .env

    environment: 
      DB_HOST: postgres
      REDIS_HOST: redis

    depends_on:
      - postgres
      - redis
      
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17
    container_name: viktolearn-postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: viktolearn-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: