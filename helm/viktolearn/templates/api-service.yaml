apiVersion: v1
kind: Service

metadata:
  name: api
  namespace: {{ .Values.namespace.name }}
  labels:
    app: api

spec:
  selector:
    app: api

  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
      protocol: TCP

  type: {{ .Values.api.service.type }}