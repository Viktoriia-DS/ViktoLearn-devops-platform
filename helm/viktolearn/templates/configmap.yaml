apiVersion: v1
kind: ConfigMap

metadata: 
    name: viktolearn-config
    namespace: {{ .Values.namespace.name }}

data:
    DB_HOST: postgres
    DB_PORT: {{ .Values.postgres.service.port | quote }}
    DB_NAME: {{ .Values.postgres.database | quote }}
    REDIS_HOST: redis
    REDIS_PORT: {{ .Values.redis.service.port | quote }}