apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: {{ .Values.namespace.name }}

spec:
  replicas: {{ .Values.postgres.replicaCount }}

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.postgres.service.port }}
          
          resources:
            requests:
              cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
              memory: {{ .Values.postgres.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
              memory: {{ .Values.postgres.resources.limits.memory | quote }}

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          env:
            - name: POSTGRES_DB
              valueFrom: 
                configMapKeyRef:
                  name: viktolearn-config
                  key: DB_NAME

            - name: POSTGRES_USER
              valueFrom: 
                secretKeyRef:
                  name: viktolearn-secret
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: viktolearn-secret
                  key: DB_PASSWORD

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc