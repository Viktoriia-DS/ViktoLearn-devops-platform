name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

      - name: Run tests
        run: pytest tests

      - name: Lint Dockerfile with Hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Build Docker image
        run: docker build -t viktolearn:latest .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            viktolearn:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kube-linter
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/stackrox/kube-linter/main/scripts/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kube-linter" version

      - name: Lint Kubernetes manifests
        run: |
          helm lint helm/viktolearn
          helm template viktolearn helm/viktolearn > /tmp/viktolearn.yaml
          kube-linter lint /tmp/viktolearn.yaml