name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

      - name: Run tests
        run: pytest tests

      - name: Lint Dockerfile with Hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Build Docker image
        run: docker build -t viktolearn:latest .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            viktolearn:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/viktolearn

      - name: Validate rendered Kubernetes manifests
        run: |
          helm template viktolearn helm/viktolearn > /tmp/viktolearn-rendered.yaml
          python scripts/validate-kubernetes.py /tmp/viktolearn-rendered.yaml

      - name: Lint Kubernetes manifests with kube-linter
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: helm/viktolearn

      - name: Install kube-score
        run: |
          curl -L \
            "https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64.tar.gz" \
            -o /tmp/kube-score.tar.gz
          tar -xzf /tmp/kube-score.tar.gz -C /tmp
          sudo install /tmp/kube-score /usr/local/bin/kube-score
          kube-score version

      - name: Run kube-score
        run: |
          helm template viktolearn helm/viktolearn > /tmp/viktolearn-kubescore.yaml
          kube-score score /tmp/viktolearn-kubescore.yaml \
            --ignore-test container-security-context-user-group-id \
            --ignore-test container-image-pull-policy \
            --ignore-test deployment-replicas \
            --ignore-test pod-networkpolicy

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag viktolearn:latest \
            ghcr.io/viktoriia-ds/viktolearn-devops-platform:${{ github.sha }}

          docker tag viktolearn:latest \
            ghcr.io/viktoriia-ds/viktolearn-devops-platform:latest

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/viktoriia-ds/viktolearn-devops-platform:${{ github.sha }}

          docker push \
            ghcr.io/viktoriia-ds/viktolearn-devops-platform:latest

      - name: Update Helm image tag
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("helm/viktolearn/values.yaml")
          s = p.read_text()
          image_tag = os.environ["IMAGE_TAG"]

          pattern = (
              r'(repository:\s*'
              r'ghcr\.io/viktoriia-ds/viktolearn-devops-platform\s*\n'
              r'\s*tag:\s*)"[^"]+"'
          )

          updated, count = re.subn(
              pattern,
              rf'\1"{image_tag}"',
              s,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not update the API GHCR image tag."
              )

          p.write_text(updated)
          print(f"Helm image tag updated to {image_tag}")
          PY

      - name: Commit Helm image tag
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- helm/viktolearn/values.yaml; then
            echo "Helm image tag already points to ${{ github.sha }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/viktolearn/values.yaml
          git diff --cached --check

          git commit -m "Deploy image ${{ github.sha }} [skip ci]"
          git push
